# new-api 上游
upstream new_api_backend {
    server 192.168.1.125:3000;
}

server {
    listen 80;
    server_name _;

    # 内部转发 location（供 poll 使用）
    # 匹配 /_internal/forward/*，然后去掉前缀转发给后端
    location /_internal/forward {
        internal;
        set $original_uri $uri;
        rewrite ^/_internal/forward(/.*)$ $1 break;
        proxy_pass http://new_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_pass_request_body on;
    }

    # ======================
    # 1. 提交任务 /v1/chat/completions
    # ======================
    location /v1/chat/completions {
        default_type application/json;
        access_by_lua_block {
            local cjson = require "cjson"
            local ngx = ngx

            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body or body == "" then
                local fp = ngx.req.get_body_file()
                if fp then
                    local f = io.open(fp, "r")
                    if f then
                        body = f:read("*a")
                        f:close()
                    end
                end
            end
            if not body or body == "" then
                ngx.say(cjson.encode({ code = 400, msg = "请求体不能为空" }))
                return ngx.exit(200)
            end

            local queueId = ngx.md5(ngx.time() .. ngx.var.remote_addr .. ngx.worker.pid())
            local queue_store = ngx.shared.queue_store

            local taskData = {
                status = "pending",
                create_time = ngx.time(),
                request_body = body,
                request_uri = ngx.var.request_uri
            }
            queue_store:set(queueId, cjson.encode(taskData), 600)

            ngx.say(cjson.encode({ code = 0, msg = "任务已提交", queueId = queueId }))
            return ngx.exit(200)
        }
    }

    # ======================
    # 2. 轮询处理 /v1/queue/poll
    # ======================
    location /v1/queue/poll {
        default_type application/json;
        access_by_lua_block {
            local cjson = require "cjson"
            local ngx = ngx

            local args = ngx.req.get_uri_args()
            local queueId = args.queueId

            if not queueId or queueId == "" then
                ngx.say(cjson.encode({ code = 400, msg = "缺少 queueId 参数" }))
                return ngx.exit(200)
            end

            local queue_store = ngx.shared.queue_store
            local taskStr = queue_store:get(queueId)

            if not taskStr then
                ngx.say(cjson.encode({ code = 404, msg = "任务不存在或已过期" }))
                return ngx.exit(200)
            end

            local task = cjson.decode(taskStr)

            -- 已完成
            if task.status == "success" or task.status == "fail" then
                local code = task.status == "success" and 0 or 500
                ngx.say(cjson.encode({
                    code = code,
                    msg = task.status == "success" and "任务执行成功" or (task.error_msg or "任务执行失败"),
                    queueId = queueId,
                    result = task.response_body
                }))
                return ngx.exit(200)
            end

            -- 处理中（防止重复处理）
            if task.status == "processing" then
                ngx.say(cjson.encode({ code = 1002, msg = "任务正在处理中", queueId = queueId }))
                return ngx.exit(200)
            end

            -- pending -> 开始处理
            if task.status == "pending" then
                task.status = "processing"
                task.create_time = ngx.time()
                queue_store:set(queueId, cjson.encode(task), 600)

                -- 解析出原始 URI 和 query string
                local uri = task.request_uri
                local q_start = string.find(uri, "?")
                local raw_uri = q_start and string.sub(uri, 1, q_start - 1) or uri
                local args = q_start and string.sub(uri, q_start + 1) or nil

                local sub = ngx.location.capture("/_internal/forward" .. raw_uri, {
                    method = ngx.HTTP_POST,
                    body = task.request_body,
                    args = args
                })

                if sub.status == 200 then
                    task.status = "success"
                    task.response_body = sub.body
                else
                    task.status = "fail"
                    task.error_msg = "后端返回状态: " .. sub.status
                    task.response_body = sub.body
                end
                task.create_time = ngx.time()
                queue_store:set(queueId, cjson.encode(task), 600)

                -- 直接透传后端原始响应
                ngx.header["Content-Type"] = "application/json"
                ngx.say(sub.body)
                return ngx.exit(200)
            end
        }
    }

    # ======================
    # 3. 查询状态 /v1/queue/status
    # ======================
    location /v1/queue/status {
        default_type application/json;
        access_by_lua_block {
            local cjson = require "cjson"
            local ngx = ngx

            local args = ngx.req.get_uri_args()
            local queueId = args.queueId

            if not queueId or queueId == "" then
                ngx.say(cjson.encode({ code = 400, msg = "缺少 queueId 参数" }))
                return ngx.exit(200)
            end

            local queue_store = ngx.shared.queue_store
            local taskStr = queue_store:get(queueId)

            if not taskStr then
                ngx.say(cjson.encode({ code = 404, msg = "任务不存在或已过期" }))
                return ngx.exit(200)
            end

            local task = cjson.decode(taskStr)
            local resp = { queueId = queueId }

            if task.status == "pending" then
                resp.code = 1001
                resp.msg = "排队等待中"
                resp.retryAfter = 3
            elseif task.status == "processing" then
                resp.code = 1002
                resp.msg = "模型正在处理请求"
            elseif task.status == "success" then
                resp.code = 0
                resp.msg = "任务执行成功"
            else
                resp.code = 500
                resp.msg = task.error_msg or "任务执行失败"
            end

            ngx.say(cjson.encode(resp))
            return ngx.exit(200)
        }
    }
}
