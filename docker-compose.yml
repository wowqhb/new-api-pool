# New API - 简易版（SQLite，单容器，本地测试用）
# 启动: cd 到本目录，执行 docker compose up -d
# 访问: http://localhost:3000
# 默认管理员账号: root  密码: 123456（首次登录后立即修改）

services:
  new-api:
    build: .
    image: ideapool/new-api-pool:latest
    container_name: new-api-node-1
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=root:root@tcp(192.168.1.125:3306)/new-api-pool  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:redis6379@192.168.1.125:6379 # ⚠️ IMPORTANT: Change the password in production!
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
