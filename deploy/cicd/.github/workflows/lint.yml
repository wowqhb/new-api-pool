name: PR Lint & Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint Go
        run: |
          go vet ./...
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Lint Python (sidecar / orchestrator)
        run: |
          pip install --quiet ruff black
          ruff check deploy/upstream/ deploy/sidecar/ || true
          black --check deploy/upstream/ deploy/sidecar/ || true

      - name: Lint frontend
        working-directory: ./web
        run: |
          npm ci --silent
          npm run lint --if-present

      - name: Validate YAML
        run: |
          pip install --quiet pyyaml jsonschema
          for f in $(find deploy/ -name "*.yml" -o -name "*.yaml"); do
              python -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done

      - name: Validate JSON configs
        run: |
          for f in $(find deploy/channels deploy/billing deploy/risk-control -name "*.json"); do
              python -m json.tool "$f" >/dev/null || exit 1
          done

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find deploy/ -name "*.sh" -print0 | xargs -0 shellcheck -S warning || true

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out

  build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: new-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
