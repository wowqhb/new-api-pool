groups:
  - name: infra
    interval: 30s
    rules:
      # ───── 主机资源 ─────
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: P2
          team: ops
        annotations:
          summary: "{{ $labels.instance }} CPU > 85% 持续 10 分钟"
          description: "当前 {{ $value | humanize }}%。检查是否被刷或异常进程。"

      - alert: HostHighMemory
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: P1
          team: ops
        annotations:
          summary: "{{ $labels.instance }} 内存 > 90%"
          description: "内存吃紧，OOM 风险。"

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"})
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} > 0.85
        for: 5m
        labels:
          severity: P1
          team: ops
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} 磁盘 > 85%"
          description: "立即清日志或扩容。"

      # ───── PG ─────
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: P0
          team: ops
        annotations:
          summary: "Postgres 不可达"
          description: "数据库挂了，业务即将全停。立即查看容器与日志。"

      - alert: PostgresHighConnections
        expr: |
          sum(pg_stat_activity_count) by (instance)
          / on(instance) pg_settings_max_connections > 0.85
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Postgres 连接数 > 85% max_connections"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 60
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "Postgres 主从延迟 > 60s"

      # ───── Redis ─────
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: P1
          team: ops
        annotations:
          summary: "Redis 不可达"
          description: "缓存/限流退化为内存模式，性能与正确性受影响。"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "Redis 内存使用 > 85%"

      # ───── 上游探活 ─────
      - alert: UpstreamDown
        expr: probe_success{job="blackbox_upstream"} == 0
        for: 5m
        labels:
          severity: P1
          team: ops
        annotations:
          summary: "上游 {{ $labels.instance }} 探活失败"
          description: "可能是官方全挂或本机出网异常。"

      - alert: UpstreamSlowProbe
        expr: probe_duration_seconds{job="blackbox_upstream"} > 10
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "上游 {{ $labels.instance }} 探测延迟 > 10s"
