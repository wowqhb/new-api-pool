global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: new-api-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ─── new-api 自身指标 ───
  - job_name: new-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - new-api-1:3000
          - new-api-2:3000
        labels:
          service: new-api

  # ─── 宿主机 ───
  - job_name: node
    static_configs:
      - targets:
          - host.docker.internal:9100
          - node-exporter:9100
        labels:
          service: node

  # ─── Postgres ───
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  # ─── Redis ───
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  # ─── 上游 API 可达性（blackbox 探活）───
  - job_name: blackbox_upstream
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.openai.com/v1/models
          - https://api.anthropic.com/v1/messages
          - https://generativelanguage.googleapis.com/v1beta/models
        labels:
          service: upstream
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ─── self ───
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
