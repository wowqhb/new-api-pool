# 监控栈：Prometheus + Grafana + Loki + Promtail + Alertmanager + 各种 exporter
#
# 用法（在 deploy/ 目录下）：
#   docker compose -f docker-compose.prod.yml -f monitoring/docker-compose.monitoring.yml up -d
#
# 访问（默认仅内网，生产请通过 Cloudflare Access 或 Caddy 反代加 IP 白名单）：
#   Grafana:      http://监控域名:3001 (admin / 在 .env 设置)
#   Prometheus:   http://监控域名:9090
#   Alertmanager: http://监控域名:9093

name: new-api-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ───────────── Prometheus 指标采集 ─────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: new-api-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://localhost:9090"
    ports:
      - "127.0.0.1:9090:9090"   # 仅本机能访问；要外网用 Caddy 反代
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ───────────── 告警分发 ─────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: new-api-alertmanager
    restart: always
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - internal
    logging: *default-logging

  # ───────────── 可视化 ─────────────
  grafana:
    image: grafana/grafana:latest
    container_name: new-api-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      TZ: Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - internal
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

  # ───────────── 日志聚合 ─────────────
  loki:
    image: grafana/loki:latest
    container_name: new-api-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - internal
    logging: *default-logging

  promtail:
    image: grafana/promtail:latest
    container_name: new-api-promtail
    restart: always
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/host/logs:ro
    networks:
      - internal
    depends_on:
      - loki
    logging: *default-logging

  # ───────────── Exporter ─────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: new-api-node-exporter
    restart: always
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    pid: host
    network_mode: host
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: new-api-postgres-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}?sslmode=disable"
    networks:
      - internal
    depends_on:
      - postgres
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: new-api-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal
    depends_on:
      - redis
    logging: *default-logging

  # 上游 API 探活：探测 OpenAI/Anthropic/Google 的 API 端点是否可达
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: new-api-blackbox-exporter
    restart: always
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    networks:
      - internal
    logging: *default-logging

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

networks:
  internal:
    external: true
    name: new-api-prod_internal
