server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ───── Docker 容器日志 ─────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - new-api-1
              - new-api-2
              - new-api-postgres
              - new-api-redis
              - new-api-caddy
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # 自动脱敏：常见 PII 用 *** 替换
      - replace:
          expression: '(?i)(email["'']?\s*[:=]\s*["'']?)([^\s"'',}]+)'
          replace: '${1}***'
      - replace:
          expression: '(?i)(api[-_]?key["'']?\s*[:=]\s*["'']?)([A-Za-z0-9_-]{20,})'
          replace: '${1}***REDACTED***'
      - replace:
          expression: '(?i)(authorization["'']?\s*[:=]\s*["'']?Bearer\s+)([A-Za-z0-9_.-]{10,})'
          replace: '${1}***REDACTED***'
      - replace:
          expression: '\b(\d{16,19})\b'        # 信用卡号
          replace: '****CARD****'
      - replace:
          expression: '\b(1[3-9]\d{9})\b'      # 大陆手机号
          replace: '***PHONE***'

  # ───── Caddy 访问日志 ─────
  - job_name: caddy
    static_configs:
      - targets: [localhost]
        labels:
          job: caddy
          __path__: /host/logs/caddy/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            request: request
            status: status
      - labels:
          status:
